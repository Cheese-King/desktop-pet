<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>栖伴 · 开始使用</title><link rel="stylesheet" href="agent.css"><script defer src="welcome.js"></script></head><body><header><div class="logo">栖</div><div><strong>栖伴</strong><p>聊天、记录，也陪你做好眼前的事。</p></div></header><main><section class="hero"><div class="eyebrow">WELCOME HOME</div><h1>先把栖伴安顿好。</h1><p>文字聊天和待办可以先用，语音服务准备好后再开启朗读。</p></section><section class="card"><h2>① 聊天与语音</h2><p id="chat-status" role="status">正在读取对话设置…</p><p id="voice-status" role="status">正在检查语音服务…</p><p class="muted">聊天设置里的“模型”指对话模型。桌面角色已固定，无需导入 Live2D 文件。</p><button id="settings">打开设置</button></section><section class="card"><h2>② 开始日常使用</h2><p>右键点击桌宠，可以打开聊天、备忘、天气和任务模式。</p><p>试着说“添加待办：整理桌面”。需要拆解目标时，先配置支持工具调用的对话模型。</p><button id="tasks" class="quiet">打开任务模式</button></section><section class="card"><h2>③ 找到栖伴</h2><p>关闭面板后桌宠会继续陪伴。隐藏后点系统托盘图标即可找回；彻底退出请选择托盘菜单里的“退出”。</p><button id="finish">开始使用</button><button id="logs" class="quiet">查看运行日志</button><p id="message" role="status"></p></section></main></body></html>
